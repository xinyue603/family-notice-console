<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭通知中控台</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="88">🏠</text></svg>'>
<style>
  :root{
    --bg:#0b0f17; --surface:#141b26; --surface2:#1b2432; --surface3:#222d3d;
    --border:rgba(255,255,255,.08); --border-hi:rgba(255,255,255,.16);
    --text:#e8edf5; --text2:#9aa7b8; --text3:#64748b;
    --accent:#5b9dff; --accent2:#7c5cff; --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444;
    --c-blue:#3b82f6; --c-red:#ef4444; --c-green:#10b981; --c-purple:#a855f7;
    --c-amber:#f59e0b; --c-slate:#64748b;
    --radius:14px;
  }
  html[data-theme="light"]{
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f7f9fc; --surface3:#eef2f8;
    --border:rgba(15,23,42,.08); --border-hi:rgba(15,23,42,.16);
    --text:#0f172a; --text2:#5b6b82; --text3:#8a99ad;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .layout{display:flex;min-height:100vh}

  /* ---------- 侧边栏 ---------- */
  aside{
    width:238px;flex:0 0 238px;background:var(--surface);border-right:1px solid var(--border);
    padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
  }
  .side-brand{display:flex;align-items:center;gap:11px;padding:4px 10px 20px}
  .side-brand .logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(145deg,#5b9dff,#7c5cff);font-size:18px}
  .side-brand b{font-size:15px;font-weight:600;display:block}
  .side-brand small{font-size:10.5px;color:var(--text3);letter-spacing:.6px}
  .nav-label{font-size:10.5px;color:var(--text3);letter-spacing:1.2px;padding:14px 12px 7px}
  .nav{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
    color:var(--text2);font-size:13.5px;cursor:pointer;border:1px solid transparent;transition:.15s;
  }
  .nav:hover{background:var(--surface2);color:var(--text)}
  .nav.active{background:rgba(91,157,255,.12);border-color:rgba(91,157,255,.26);color:var(--accent);font-weight:550}
  .nav .ico{font-size:15px;width:18px;text-align:center}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .back{
    display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border-radius:10px;
    background:var(--surface2);border:1px solid var(--border);color:var(--text2);
    font-size:13px;text-decoration:none;transition:.15s;
  }
  .back:hover{color:var(--text);border-color:var(--border-hi)}

  /* ---------- 主区 ---------- */
  main{flex:1;min-width:0;padding:26px 34px 80px}
  .page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:24px}
  .page-head h1{font-size:22px;font-weight:650;letter-spacing:.2px}
  .page-head p{font-size:12.5px;color:var(--text3);margin-top:5px;line-height:1.6}
  .head-actions{margin-left:auto;display:flex;gap:9px;align-items:center}

  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;
    font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--surface2);
    color:var(--text2);transition:.15s;white-space:nowrap;
  }
  .btn:hover{color:var(--text);border-color:var(--border-hi);background:var(--surface3)}
  .btn.primary{
    background:linear-gradient(145deg,#5b9dff,#4b7fe0);border-color:transparent;color:#fff;font-weight:550;
    box-shadow:0 6px 18px rgba(91,157,255,.28);
  }
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.danger{color:var(--danger);border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.08)}
  .btn.danger:hover{background:rgba(239,68,68,.14)}

  .panel{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;margin-bottom:22px;
  }
  .panel-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
  .panel-head h2{font-size:14.5px;font-weight:600}
  .panel-head .hint{font-size:12px;color:var(--text3);margin-left:auto}
  .panel-body{padding:18px 20px}

  /* 表格 */
  table{width:100%;border-collapse:collapse}
  th{
    text-align:left;font-size:11.5px;font-weight:500;color:var(--text3);
    letter-spacing:.6px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface2)}
  .grab{color:var(--text3);cursor:grab;font-size:14px;user-select:none}
  .swatch{width:16px;height:16px;border-radius:6px;display:inline-block;vertical-align:-3px;box-shadow:0 0 0 1px rgba(255,255,255,.14) inset}
  .tag-name{display:inline-flex;align-items:center;gap:8px;font-weight:550;white-space:nowrap}
  .who-cell{display:inline-flex;align-items:center;gap:7px;font-weight:500;white-space:nowrap}
  .av-s{
    width:21px;height:21px;border-radius:50%;flex:none;display:inline-grid;place-items:center;
    font-size:10.5px;font-weight:680;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);
  }
  .tag-emoji{font-size:15px}
  .muted{color:var(--text3);font-size:12.5px}

  /* 开关 */
  .switch{position:relative;width:38px;height:21px;border-radius:999px;background:var(--surface3);
    border:1px solid var(--border);cursor:pointer;transition:.18s;display:inline-block;vertical-align:middle}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
    background:#8b98aa;transition:.18s}
  .switch.on{background:rgba(34,197,94,.22);border-color:rgba(34,197,94,.45)}
  .switch.on::after{left:19px;background:var(--ok)}

  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .mini{
    padding:5px 9px;border-radius:7px;font-size:11.5px;cursor:pointer;
    background:var(--surface2);border:1px solid var(--border);color:var(--text2);transition:.15s;
  }
  .mini:hover{color:var(--text);border-color:var(--border-hi)}
  .mini.del:hover{color:var(--danger);border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08)}

  /* 表单 */
  .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px}
  .field{display:flex;flex-direction:column;gap:7px}
  .field.full{grid-column:1/-1}
  label{font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:7px}
  label .req{color:var(--danger)}
  input[type=text],input[type=password],input[type=number],select{
    width:100%;padding:10px 12px;border-radius:9px;background:var(--surface2);
    border:1px solid var(--border);color:var(--text);font-size:13.5px;outline:none;transition:.15s;
    font-family:inherit;
  }
  input:focus,select:focus{border-color:rgba(91,157,255,.55);box-shadow:0 0 0 3px rgba(91,157,255,.12)}
  .help{font-size:11.5px;color:var(--text3);line-height:1.55}
  .input-wrap{position:relative}
  .input-wrap input{padding-right:44px}
  .eye{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;
    display:grid;place-items:center;border-radius:7px;cursor:pointer;color:var(--text3);font-size:13px;
  }
  .eye:hover{background:var(--surface3);color:var(--text)}
  .badge-ok{
    display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11px;
    color:var(--ok);background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.28);
  }

  .divider{height:1px;background:var(--border);margin:22px 0}

  /* 提示条 */
  .notice{
    display:flex;gap:10px;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.65;
    background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.24);color:#f3c77d;margin-bottom:18px;
  }
  html[data-theme="light"] .notice{color:#8a5a00}
  .notice .i{flex:0 0 auto}

  /* toast */
  .toast{
    position:fixed;right:26px;bottom:26px;padding:11px 16px;border-radius:10px;font-size:13px;
    background:var(--surface3);border:1px solid var(--border-hi);color:var(--text);
    box-shadow:0 16px 40px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);
    transition:.25s;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;transform:none}

  /* 弹窗 */
  .modal{position:fixed;inset:0;background:rgba(3,6,12,.7);backdrop-filter:blur(6px);
    display:none;place-items:center;z-index:60;padding:24px}
  .modal.show{display:grid}
  .dialog{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--border-hi);
    border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.5);max-height:92vh;overflow-y:auto}
  .dialog-head{padding:18px 20px;border-bottom:1px solid var(--border);font-size:15px;font-weight:600}
  .dialog-body{padding:20px;display:flex;flex-direction:column;gap:16px}
  .dialog-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end}
  .color-row{display:flex;gap:9px;flex-wrap:wrap}
  .color-dot{width:28px;height:28px;border-radius:9px;cursor:pointer;border:2px solid transparent;transition:.15s}
  .color-dot:hover{transform:scale(1.08)}
  .color-dot.sel{border-color:#fff;box-shadow:0 0 0 2px var(--bg) inset}

  /* ---------- 图标选择器 ---------- */
  .icon-row{display:flex;gap:12px;align-items:flex-start}
  .icon-box{
    width:58px;height:58px;flex:none;border-radius:13px;border:1px solid var(--border-hi);
    background:var(--surface2);font-size:27px;text-align:center;padding:0;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }
  .icon-box:focus{border-color:rgba(91,157,255,.55);box-shadow:0 0 0 3px rgba(91,157,255,.12)}
  .icon-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .icon-side input[type=text]{padding:8px 11px;font-size:12.5px}
  .icon-cats{display:flex;gap:5px;flex-wrap:wrap}
  .cat{
    font-size:11.5px;padding:4px 9px;border-radius:7px;cursor:pointer;
    background:var(--surface2);border:1px solid var(--border);color:var(--text3);transition:.14s;
  }
  .cat:hover{color:var(--text2);border-color:var(--border-hi)}
  .cat.on{color:var(--accent);background:rgba(91,157,255,.13);border-color:rgba(91,157,255,.34)}
  .icon-grid{
    display:grid;grid-template-columns:repeat(9,1fr);gap:6px;
    max-height:126px;overflow-y:auto;padding:3px;margin-top:2px;
    scrollbar-width:thin;
  }
  .icon-opt{
    height:36px;display:grid;place-items:center;font-size:18px;cursor:pointer;
    border-radius:9px;border:1px solid transparent;background:var(--surface2);transition:.12s;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }
  .icon-opt:hover{background:var(--surface3);border-color:var(--border-hi);transform:translateY(-1px)}
  .icon-opt.sel{background:rgba(91,157,255,.16);border-color:rgba(91,157,255,.6)}
  .icon-empty{grid-column:1/-1;padding:16px;text-align:center;font-size:12px;color:var(--text3)}

  .proto-tip{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;
    display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;
    background:rgba(20,27,38,.92);border:1px solid var(--border-hi);color:var(--text2);
    font-size:12.5px;backdrop-filter:blur(10px);white-space:nowrap;
  }
  .proto-tip b{color:var(--accent)}

  /* ---------- 登录 / 首次设置口令 ---------- */
  .gate{
    position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:24px;
    background:radial-gradient(900px 600px at 50% -10%, rgba(91,157,255,.16), transparent 62%), rgba(6,9,15,.9);
    backdrop-filter:blur(10px);
  }
  .gate.show{display:grid}
  .gate-card{
    width:100%;max-width:398px;background:var(--surface);border:1px solid var(--border-hi);
    border-radius:18px;padding:30px 28px 24px;box-shadow:0 30px 80px rgba(0,0,0,.55);
  }
  .gate-logo{display:flex;align-items:center;gap:11px;margin-bottom:20px}
  .gate-logo .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(145deg,#5b9dff,#7c5cff);font-size:19px}
  .gate-logo b{font-size:15px;display:block}
  .gate-logo small{font-size:10.5px;color:var(--text3);letter-spacing:.6px}
  .gate-card h2{font-size:19px;font-weight:650;letter-spacing:.2px}
  .gate-card .sub{font-size:12.5px;color:var(--text3);line-height:1.75;margin:7px 0 20px}
  .pw-wrap{position:relative}
  .pw-wrap input{padding-right:40px}
  .pw-wrap .eye{position:absolute;right:11px;top:50%;transform:translateY(-50%);
    cursor:pointer;color:var(--text3);font-size:14px;user-select:none}
  .pw-wrap .eye:hover{color:var(--text)}
  .strength{display:flex;gap:5px;margin-top:9px}
  .strength i{flex:1;height:4px;border-radius:3px;background:var(--surface3);transition:.2s}
  .strength.lv1 i:nth-child(1){background:var(--danger)}
  .strength.lv2 i:nth-child(-n+2){background:var(--warn)}
  .strength.lv3 i:nth-child(-n+3){background:#84cc16}
  .strength.lv4 i{background:var(--ok)}
  .pw-hint{font-size:11.5px;color:var(--text3);margin-top:7px}
  .gate-card .field + .field{margin-top:15px}
  .gate-card .field > label{margin-bottom:1px}
  .err{
    display:none;margin:5px 0 12px;padding:9px 11px;border-radius:9px;font-size:12px;
    background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.28);color:#fca5a5;
  }
  .err.show{display:block}
  .wide{width:100%;justify-content:center;padding:11px;font-size:13.5px}
  .gate-foot{font-size:11.5px;color:var(--text3);line-height:1.8;margin-top:18px;
    border-top:1px dashed var(--border);padding-top:14px}
  .gate-foot code{background:var(--surface3);padding:2px 6px;border-radius:5px;font-size:10.5px;
    color:var(--text2);word-break:break-all}
  .rem{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2);margin:10px 0 16px;cursor:pointer}
  .rem input{width:15px;height:15px;accent-color:var(--accent)}

  /* ---------- 批量操作条 ---------- */
  .bulkbar{
    display:none;align-items:center;gap:12px;padding:11px 16px;margin-bottom:12px;
    background:rgba(91,157,255,.09);border:1px solid rgba(91,157,255,.26);border-radius:11px;font-size:13px;
  }
  .bulkbar.show{display:flex}
  .bulkbar b{color:var(--accent)}
  .bulkbar .sp{margin-left:auto;display:flex;gap:8px}

  /* ---------- 常驻标记 ---------- */
  .pin-btn{
    display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:7px;font-size:11.5px;
    cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text3);transition:.15s;
    white-space:nowrap;
  }
  .pin-btn:hover{color:var(--text);border-color:var(--border-hi)}
  .pin-btn.on{color:#f0b25e;background:rgba(245,158,11,.13);border-color:rgba(245,158,11,.34)}
  tr.is-pinned{background:rgba(245,158,11,.05)}
  .pick{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}

  /* ---------- 备份 / 恢复 ---------- */
  .drop{
    border:1px dashed var(--border-hi);border-radius:12px;padding:24px 18px;text-align:center;
    background:var(--surface2);transition:.18s;cursor:pointer;
  }
  .drop:hover,.drop.over{border-color:rgba(91,157,255,.55);background:rgba(91,157,255,.06)}
  .drop .ico{font-size:26px;opacity:.7;margin-bottom:9px}
  .drop b{font-size:13.5px;font-weight:600;display:block;margin-bottom:5px}
  .drop span{font-size:12px;color:var(--text3);line-height:1.7}
  .file-card{
    display:none;align-items:center;gap:11px;margin-top:12px;padding:11px 14px;border-radius:10px;
    background:var(--surface2);border:1px solid var(--border);font-size:12.5px;
  }
  .file-card.show{display:flex}
  .file-card .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-card .x{margin-left:auto;cursor:pointer;color:var(--text3);padding:0 4px}
  .warn-bar{
    display:flex;gap:9px;padding:10px 13px;border-radius:10px;font-size:12px;line-height:1.7;
    background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.26);color:#f0c48a;margin-top:12px;
  }
  .warn-bar.info{background:rgba(91,157,255,.09);border-color:rgba(91,157,255,.26);color:#9dc0ff}

  /* ── 看板显示偏好：一行一项，右侧胶囊开关 ──
     类名用 pft/pfd/pfs，不要叫 pt/pd —— .pt 是「接入方式」选择卡的类，
     复用会被 pickIM 的点击绑定误伤，也会被赋上卡片背景边框 */
  .pref-list{display:flex;flex-direction:column}
  .pref{
    display:grid;grid-template-columns:1fr 44px;grid-template-areas:"t s" "d s";
    align-items:center;gap:2px 14px;padding:12px 2px;cursor:pointer;
    border-bottom:1px dashed var(--border);
  }
  .pref:last-child{border-bottom:none}
  .pref:hover .pft{color:#fff}
  .pref .pft{grid-area:t;font-size:13px;color:var(--text);font-weight:550;
    display:flex;align-items:center;gap:8px;transition:color .15s}
  .pref .pft .num{font-size:10.5px;font-weight:600;color:#7dd3fc;background:rgba(91,157,255,.12);
    border:1px solid rgba(91,157,255,.28);border-radius:6px;padding:1px 6px}
  .pref .pfd{grid-area:d;font-size:11.5px;color:var(--text3);line-height:1.6}
  .pref .pfs{
    grid-area:s;position:relative;width:38px;height:21px;border-radius:999px;
    background:var(--surface3);border:1px solid var(--border);transition:.18s;justify-self:end;
  }
  .pref .pfs::after{
    content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
    background:#64748b;transition:.18s cubic-bezier(.4,0,.2,1);
  }
  .pref .pfs.on{background:rgba(34,197,94,.22);border-color:rgba(34,197,94,.45)}
  .pref .pfs.on::after{left:19px;background:var(--ok);box-shadow:0 0 6px rgba(34,197,94,.45)}

  /* ── 设备映射表 ── */
  .map-note{font-size:12px;color:var(--text2);line-height:1.85;margin-bottom:14px;
    padding:11px 14px;border-radius:10px;background:rgba(91,157,255,.07);
    border:1px solid rgba(91,157,255,.2)}
  .map-note code{font-size:11px;color:#9dc0ff;background:rgba(91,157,255,.12);
    border-radius:4px;padding:1px 5px}
  .maptbl{width:100%;border-collapse:collapse;font-size:12px}
  .maptbl th{text-align:left;font-weight:600;color:var(--text3);font-size:11px;
    letter-spacing:.6px;padding:0 10px 9px;border-bottom:1px solid var(--border)}
  .maptbl td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text2)}
  .maptbl tr:last-child td{border-bottom:none}
  .maptbl td:first-child{color:var(--text);font-weight:550;white-space:nowrap}
  .maptbl code{font-size:10.5px;color:#9dc0ff;word-break:break-all}
  .maptbl td.st-on{color:#4ade80;font-weight:600}
  .maptbl td.st-off{color:var(--text3)}
  .maptbl td.st-bad{color:#f87171}
  .maptbl .kind{font-size:10.5px;color:var(--text3);width:38px}

  /* 设备映射可编辑态 */
  .map-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .map-toolbar .btn{padding:6px 11px;font-size:12px;border-radius:8px}
  .map-tip{margin-left:auto;font-size:11.5px;color:var(--text3)}
  /* 实体筛选：switch 域两百多项，靠它缩小下拉范围 */
  .map-filter{
    width:210px;background:var(--surface3);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-size:12px;padding:5px 10px;font-family:inherit;
  }
  .map-filter::placeholder{color:var(--text3)}
  .map-filter:focus{outline:none;border-color:var(--accent)}
  .map-fcnt{font-size:11.5px;color:var(--text3)}
  .maptbl input.map-name{
    width:100%;min-width:88px;background:var(--surface3);border:1px solid var(--border);
    border-radius:7px;color:var(--text);font-size:12px;padding:5px 8px;font-family:inherit;
  }
  .maptbl select.map-eid{
    width:100%;background:var(--surface3);border:1px solid var(--border);
    border-radius:7px;color:var(--text2);font-size:11.5px;padding:5px 6px;font-family:inherit;
  }
  .maptbl input.map-name:focus,.maptbl select.map-eid:focus{
    outline:none;border-color:var(--accent);color:var(--text);
  }
  .maptbl tr.dirty td{background:rgba(91,157,255,.055)}
  .maptbl tr.dirty select.map-eid,.maptbl tr.dirty input.map-name{border-color:rgba(91,157,255,.5)}
  /* 筛选生效时，当前实体不在结果里的行调淡 */
  .maptbl select.map-eid.fmiss{opacity:.45}
  .map-del{
    background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;
    padding:2px 5px;border-radius:6px;line-height:1;
  }
  .map-del:hover{color:var(--danger);background:rgba(239,68,68,.1)}
  .map-actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .map-actions .help{margin:0}
  .maptbl td.warn-cell{color:var(--warn)}
  .warn-bar .good{color:var(--ok);font-weight:600}
  .warn-bar .bad{color:var(--danger);font-weight:600}

  /* ===== V3：接入方式二选一 ===== */
  .im-pick{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .im-opt{
    position:relative;padding:16px 18px;border-radius:12px;cursor:pointer;
    background:var(--surface2);border:1.5px solid var(--border);transition:.16s;
  }
  .im-opt:hover{border-color:var(--border-hi)}
  .im-opt.on{border-color:var(--accent);background:rgba(91,157,255,.07)}
  .im-opt .t{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:620;margin-bottom:5px}
  .im-opt .d{font-size:11.5px;color:var(--text3);line-height:1.65;padding-right:14px}
  .im-opt .d b{font-weight:600}
  .im-opt .d .good{color:var(--ok)}
  .im-opt .d .warn{color:var(--warn)}
  .im-opt .ck{
    position:absolute;right:14px;top:16px;width:19px;height:19px;border-radius:50%;
    border:1.5px solid var(--border-hi);display:grid;place-items:center;
    font-size:11px;color:transparent;transition:.16s;
  }
  .im-opt.on .ck{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ===== V3：统计数字 ===== */
  .stat{display:flex;gap:30px;flex-wrap:wrap;margin-bottom:18px}
  .stat .s{min-width:104px}
  .stat .s b{
    display:block;font-size:23px;font-weight:680;line-height:1.25;
    font-variant-numeric:tabular-nums;letter-spacing:-.5px;
  }
  .stat .s b.ph{color:var(--text3);font-weight:400}
  .stat .s span{font-size:11.5px;color:var(--text3)}
  .stat .s.hot b{color:var(--warn)}

  /* ===== V3：连接状态徽章 ===== */
  .live-badge{
    display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;
    font-size:12px;border:1px solid;white-space:nowrap;line-height:1.5;
  }
  .live-badge i{width:6px;height:6px;border-radius:50%;flex:none}
  .live-badge.off{background:rgba(100,116,139,.14);border-color:rgba(100,116,139,.34);color:#94a3b8}
  .live-badge.off i{background:#64748b}
  .live-badge.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.32);color:#4ade80}
  .live-badge.ok i{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
  .live-badge.err{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.32);color:#f87171}
  .live-badge.err i{background:#ef4444}

  /* ===== V3：行内勾选 ===== */
  .chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);cursor:pointer;white-space:nowrap}
  .chk input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}

  /* ===== V3：标签列表内联播报开关 ===== */
  .tg-sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .tg-sw .pill{
    position:relative;width:34px;height:19px;border-radius:999px;flex:none;
    background:var(--surface3);border:1px solid var(--border);transition:.18s;
  }
  .tg-sw .knob{
    position:absolute;top:1px;left:1px;width:15px;height:15px;border-radius:50%;
    background:#64748b;transition:left .18s cubic-bezier(.4,0,.2,1),background .18s;
  }
  .tg-sw:hover .pill{border-color:var(--border-hi)}
  .tg-sw.on .pill{background:rgba(34,197,94,.22);border-color:rgba(34,197,94,.45)}
  .tg-sw.on .knob{left:16px;background:var(--ok);box-shadow:0 0 6px rgba(34,197,94,.45)}
  .tg-sw .lb{font-size:11.5px;color:var(--text3);line-height:1;transition:.18s}
  .tg-sw.on .lb{color:#4ade80}

  .empty-note{
    padding:34px 24px;text-align:center;color:var(--text3);font-size:12.5px;line-height:1.9;
    border:1px dashed var(--border);border-radius:12px;
  }

  @media (max-width:820px){
    .layout{flex-direction:column}
    aside{width:auto;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
    .side-brand{padding:0 10px 0 4px}
    .nav-label{display:none}
    .side-foot{margin:0 0 0 auto;flex-direction:row}
    main{padding:18px 16px 70px}
    .form-grid{grid-template-columns:1fr}
    .im-pick{grid-template-columns:1fr}
    .panel{overflow-x:auto}
    table{min-width:760px}
    .gate-card{padding:24px 20px 20px}
  }

  /* ═══════════ V5 ═══════════ */

  /* 退出登录（底部红按钮） */
  .back.out{color:#fca5a5;border-color:rgba(239,68,68,.25);background:rgba(239,68,68,.07)}
  .back.out:hover{background:rgba(239,68,68,.13);color:#fecaca}

  /* panel-head 里的小保存按钮（hint 已 margin-left:auto，按钮排它右边） */
  .panel-head .btn{padding:6px 12px;font-size:12px;border-radius:8px;margin-left:10px}

  /* 消息列表的筛选行（从原 page-head 挪进面板） */
  .tbl-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;
    padding:12px 18px;border-bottom:1px solid var(--border)}
  .tbl-tools input,.tbl-tools select{background:var(--surface3);border:1px solid var(--border);
    border-radius:9px;color:var(--text);font-size:12.5px;padding:7px 10px;font-family:inherit}

  /* ── 设置家庭位置：位置来源选择卡 ──
     类名别叫 pick：.pick 是消息表格复选框的类 */
  .srcpick{display:block;border:1px solid var(--border);border-radius:12px;padding:14px 16px;
    background:var(--surface2);cursor:pointer;margin-bottom:12px;transition:.14s}
  .srcpick:last-child{margin-bottom:0}
  .srcpick:hover{border-color:var(--border-hi)}
  .srcpick.on{border-color:rgba(91,157,255,.45);background:rgba(91,157,255,.07)}
  .sp-h{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600}
  .rad{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border-hi);
    flex:none;position:relative}
  .srcpick.on .rad{border-color:var(--accent)}
  .srcpick.on .rad::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
  .sp-d{font-size:12px;color:var(--text3);line-height:1.65;margin:7px 0 0 24px}
  .sp-read{margin:10px 0 0 24px;display:flex;align-items:center;gap:10px;font-size:12px;
    color:var(--text3);flex-wrap:wrap}
  .sp-read b{color:var(--text);font-weight:600;font-size:13px}
  .sp-read code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
    background:rgba(255,255,255,.06);padding:1px 5px;border-radius:5px;color:#93c5fd}
  .sp-form{margin:12px 0 0 24px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
  .sp-form label{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--text3)}
  .sp-form input{background:var(--surface3);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-size:12.5px;padding:7px 10px;font-family:inherit;width:170px}
  .sp-form input:focus{outline:none;border-color:var(--accent)}
  .sp-form .tip{font-size:11px;color:var(--text3);max-width:240px;line-height:1.5}

  .form-grid .fld{display:flex;flex-direction:column;gap:7px}
  .fld>span{font-size:11.5px;color:var(--text3)}
  .fld select,.fld input{background:var(--surface3);border:1px solid var(--border);border-radius:9px;
    color:var(--text);font-size:12.5px;padding:8px 10px;font-family:inherit;width:100%}
  .fld select:focus,.fld input:focus{outline:none;border-color:var(--accent)}

  /* 天气预览滚动条（正式版由 index.html 的同款样式负责看板顶部） */
  .wx-demo{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:11px;
    background:rgba(91,157,255,.07);border:1px solid rgba(91,157,255,.16);margin-bottom:14px}
  .wx-demo .wx-ico{font-size:16px;line-height:1}
  .wx-mask{flex:1;min-width:0;max-width:520px;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);
    mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
  .wx-track{display:inline-flex;white-space:nowrap;will-change:transform;
    animation:wxrun 22s linear infinite}
  .wx-track>span{padding-right:56px;font-size:13px;color:var(--text2)}
  .wx-track b{color:var(--text);font-weight:600}
  @keyframes wxrun{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  .ro-list .ro{display:flex;gap:10px;font-size:12px;color:var(--text3);padding:7px 0;
    border-bottom:1px dashed var(--border)}
  .ro-list .ro:last-child{border-bottom:none}
  .ro-list .ro b{color:var(--text);font-weight:550;margin-left:auto;text-align:right;max-width:72%}

  /* ===== V6-1：家庭状态接入总开关 ===== */
  .master{display:flex;align-items:center;gap:16px;padding:16px 18px;margin-bottom:18px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
  .master.off{border-color:rgba(239,68,68,.28);background:rgba(239,68,68,.035)}
  .master .mi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:rgba(91,157,255,.14);font-size:19px;flex:none}
  .master .mt{font-size:14px;font-weight:600}
  .master .md{font-size:11.5px;color:var(--text3);line-height:1.65;margin-top:4px;max-width:760px}
  .sw{width:52px;height:28px;border-radius:999px;background:var(--surface3);
    border:1px solid var(--border-hi);position:relative;cursor:pointer;flex:none;margin-left:auto}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
    background:var(--text3);transition:.18s}
  .sw.on{background:rgba(34,197,94,.22);border-color:rgba(34,197,94,.45)}
  .sw.on::after{left:26px;background:var(--ok)}
  .sw-state{font-size:12.5px;font-weight:600;color:#86efac;min-width:56px;text-align:right}
  .sw-state.off{color:#fca5a5}
  .panel.dim{opacity:.45}
  .link-note{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.7;
    border-radius:9px;padding:9px 12px;margin-bottom:14px;
    background:rgba(91,157,255,.09);border:1px solid rgba(91,157,255,.26);color:#9dc0ff}
  .link-note.off{background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.28);color:#fca5a5}
  .srcpick.disabled{opacity:.42;cursor:not-allowed}
  .srcpick.disabled:hover{border-color:var(--border)}

  /* ===== V6-2：设备搜索 + 6 列映射表 ===== */
  .dev-search-wrap{position:relative;margin-bottom:14px}
  .dev-search{display:flex;align-items:center;gap:10px;background:var(--surface3);
    border:1px solid var(--border);border-radius:10px;padding:9px 12px}
  .dev-search:focus-within{border-color:var(--accent)}
  .dev-search .si{font-size:14px;color:var(--text3);flex:none}
  .dev-search input{flex:1;min-width:0;background:transparent;border:0;outline:none;
    color:var(--text);font-size:12.5px;font-family:inherit}
  .dev-search input::placeholder{color:var(--text3)}
  .dev-search .sc{font-size:11px;color:var(--text3);flex:none}
  .dev-results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;
    background:#243145;border:1px solid rgba(91,157,255,.45);border-radius:11px;
    box-shadow:0 20px 44px rgba(0,0,0,.8);max-height:290px;overflow:auto;display:none}
  .dev-results.show{display:block}
  .dev-res-h{padding:8px 13px;font-size:11px;color:#9dc0ff;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:#243145}
  .dev-item{display:flex;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,.04)}
  .dev-item:last-child{border-bottom:none}
  .dev-item:hover{background:rgba(91,157,255,.12)}
  .dev-item.added{opacity:.45;cursor:not-allowed}
  .dev-item .dn{font-size:12.5px;font-weight:550;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dev-item .de{font-size:10.5px;color:#93c5fd;font-family:ui-monospace,Menlo,monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .dev-item .dk{font-size:10.5px;color:var(--text3);flex:none}
  .dev-item .ds{font-size:10.5px;color:#4ade80;flex:none;min-width:42px;text-align:right}
  .dev-item .ds.off{color:var(--text3)}
  .dev-badge{font-size:10px;border-radius:999px;padding:1px 7px;flex:none;white-space:nowrap}
  .dev-badge.ind{color:#fbbf24;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3)}
  .dev-badge.added{color:#86efac;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3)}
  .dev-empty{padding:16px 13px;font-size:12px;color:var(--text3);text-align:center}
  .maptbl{table-layout:fixed}
  .maptbl tr.off td{opacity:.45}
  .ent-name{font-size:12px;color:var(--text);font-weight:550;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ent-eid{font-size:10.5px;color:#9dc0ff;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini-sw{width:36px;height:20px;border-radius:999px;background:var(--surface3);
    border:1px solid var(--border-hi);position:relative;cursor:pointer;display:inline-block;vertical-align:middle}
  .mini-sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:var(--text3);transition:.18s}
  .mini-sw.on{background:rgba(34,197,94,.22);border-color:rgba(34,197,94,.45)}
  .mini-sw.on::after{left:18px;background:var(--ok)}
  .map-cnt{font-size:11.5px;color:var(--text3);margin-left:auto}

  /* ===== V7：成员 / 用电 / 温度 sensor 映射 ===== */
  .dev-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .dev-bar .dev-search-wrap{flex:1;min-width:260px;margin-bottom:0}
  .dev-bar .dev-results{max-height:320px}
  .addas{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text3);flex:none}
  .addas select{background:var(--surface3);border:1px solid var(--border);border-radius:9px;
    color:var(--text);font-size:12px;padding:8px 10px;font-family:inherit;outline:none}
  .addas select:focus{border-color:var(--accent)}
  .dev-count{font-size:11px;color:var(--text3);flex:none}
  .dev-badge.k{color:#9dc0ff;background:rgba(91,157,255,.12);border:1px solid rgba(91,157,255,.3)}
  .maptbl tr.grp td{background:rgba(255,255,255,.025);color:var(--text3);font-size:11px;
    padding:6px 10px;letter-spacing:.5px;font-weight:400;white-space:normal}
  .maptbl tr.grp td b{color:var(--text2);font-weight:600}
  .sens-tag{font-size:10.5px;color:var(--text3)}
  .sens-tag.total{color:#fbbf24}
  .sens-val{font-size:12px;color:var(--text)}
  .sens-val.zero{color:var(--text3)}
  .sens-empty{font-size:12px;color:var(--text3);padding:8px 0}
  .sens-note{font-size:11.5px;color:var(--text3);line-height:1.8;margin-top:12px;
    padding-top:12px;border-top:1px solid var(--border)}

</style>
</head>
</html>
