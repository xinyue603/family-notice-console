<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭通知中控台</title>
<style>
  :root{
    --bg:#0b0f17; --surface:#141b26; --surface2:#1b2432; --surface3:#222d3d;
    --border:rgba(255,255,255,.08); --border-hi:rgba(255,255,255,.16);
    --text:#e8edf5; --text2:#9aa7b8; --text3:#64748b;
    --accent:#5b9dff; --ok:#22c55e;
    --radius:18px;
    --c-blue:#3b82f6; --c-red:#ef4444; --c-green:#10b981; --c-purple:#a855f7;
    --c-amber:#f59e0b; --c-slate:#64748b;
  }
  html[data-theme="light"]{
    --bg:#f4f6fb; --surface:#ffffff; --surface2:#f7f9fc; --surface3:#eef2f8;
    --border:rgba(15,23,42,.08); --border-hi:rgba(15,23,42,.16);
    --text:#0f172a; --text2:#5b6b82; --text3:#8a99ad;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .3s,color .3s;
    overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(91,157,255,.16), transparent 60%),
      radial-gradient(700px 420px at 92% 4%, rgba(168,85,247,.12), transparent 62%);
  }
  .wrap{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:0 28px 90px}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:14px;
    padding:15px 2px; margin-bottom:6px;
    background:color-mix(in srgb, var(--bg) 80%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:650;letter-spacing:.2px}
  .brand .logo{
    width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(145deg,#5b9dff,#7c5cff); box-shadow:0 6px 18px rgba(91,157,255,.32);
  }
  .brand small{display:block;font-size:10.5px;font-weight:400;color:var(--text3);letter-spacing:.8px;margin-top:3px}
  .clock{margin-left:auto;display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
  .clock b{font-size:23px;font-weight:620;letter-spacing:.5px}
  .clock span{font-size:12.5px;color:var(--text2)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
    background:var(--surface2);border:1px solid var(--border);font-size:12.5px;color:var(--text2)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.16)}
  .icon-btn{
    width:38px;height:38px;border-radius:11px;display:grid;place-items:center;cursor:pointer;
    background:var(--surface2);border:1px solid var(--border);color:var(--text2);
    transition:.18s; font-size:15px; text-decoration:none;
  }
  .icon-btn:hover{background:var(--surface3);color:var(--text);border-color:var(--border-hi);transform:translateY(-1px)}
  .icon-btn.on{color:var(--accent);border-color:rgba(91,157,255,.4);background:rgba(91,157,255,.12)}

  /* ---------- 状态条 ---------- */
  .statusbar{display:flex;align-items:center;gap:9px;margin:16px 0 4px;flex-wrap:wrap}
  .chip{padding:5px 10px;border-radius:8px;font-size:11.5px;color:var(--text3);background:var(--surface2);border:1px solid var(--border)}
  .chip.r{margin-left:auto}

  /* ---------- 分组 ---------- */
  .group{margin-top:30px}
  .day{display:flex;align-items:center;gap:12px;margin:0 2px 16px;color:var(--text3);font-size:12px;letter-spacing:1.6px}
  .day::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
  .cols{columns:var(--cols,2);column-gap:20px}

  /* ---------- 常驻区 ---------- */
  .pin-sec{margin-top:18px}
  .pin-head{
    display:flex;align-items:center;gap:9px;margin:0 2px 14px;
    font-size:12px;letter-spacing:1.6px;color:#f0b25e;
  }
  .pin-head .ln{flex:1;height:1px;background:linear-gradient(90deg,rgba(245,158,11,.42),transparent)}
  .card.pinned{
    border-color:rgba(245,158,11,.32);
    background:linear-gradient(180deg, rgba(245,158,11,.07), var(--surface2) 46%);
    box-shadow:0 0 0 1px rgba(245,158,11,.06) inset;
  }
  .card.pinned::after{
    content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;
    background:radial-gradient(circle,rgba(245,158,11,.18),transparent 66%);pointer-events:none;
  }
  .pin-tag{
    display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:6px;
    font-size:10.5px;font-weight:600;color:#f0b25e;
    background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3);
  }

  /* ---------- 卡片 ---------- */
  .card{
    background:linear-gradient(180deg, var(--surface), var(--surface2));
    border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px 16px; margin-bottom:20px;
    position:relative; overflow:hidden;
    transition:transform .18s, border-color .18s, box-shadow .18s;
    container-type:inline-size;   /* 字号跟着卡片实际宽度走，不依赖视口 */
  }
  .card:hover{transform:translateY(-2px);border-color:var(--border-hi);box-shadow:0 14px 34px rgba(0,0,0,.26)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--c-slate));opacity:.92}
  .card.is-new{animation:pop .5s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 11px;border-radius:9px;font-size:12.5px;font-weight:600;letter-spacing:.2px;
    color:var(--c,var(--c-slate));
    background:color-mix(in srgb, var(--c,var(--c-slate)) 15%, transparent);
    border:1px solid color-mix(in srgb, var(--c,var(--c-slate)) 32%, transparent);
  }
  .badge .emoji{font-size:13.5px}
  .time{margin-left:auto;font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;white-space:nowrap}

  .text{color:var(--text);word-break:break-word;white-space:pre-wrap}
  /* 用 cqw 相对【卡片宽度】计算，单列/双列/手机自动得到合适字号 */
  .text.xs{font-size:clamp(17px,3.6cqw,23px);line-height:1.7}
  .text.sm{font-size:clamp(19px,4.4cqw,27px);line-height:1.62}
  .text.md{font-size:clamp(22px,5.9cqw,34px);font-weight:550;line-height:1.45}
  .text.lg{font-size:clamp(28px,7.8cqw,50px);font-weight:660;line-height:1.29;letter-spacing:.3px}

  /* 图片完整展示：边框/底色只画在 img 自身，竖版图片不会留大片黑边 */
  .shot{margin:2px 0 13px}
  .frame{position:relative;width:fit-content;max-width:100%;margin:0 auto;line-height:0}
  .frame img{
    display:block;width:auto;max-width:100%;max-height:min(56vh,700px);
    object-fit:contain;cursor:zoom-in;border-radius:13px;
    border:1px solid var(--border);background:#070b12;
    transition:filter .18s;
  }
  .frame img:hover{filter:brightness(1.06)}

  /* ---------- 发送人署名 ---------- */
  .who{
    display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;
    border-top:1px dashed var(--border);font-size:12.5px;color:var(--text3);
  }
  .av{
    width:25px;height:25px;border-radius:50%;flex:none;
    display:grid;place-items:center;font-size:11.5px;font-weight:680;color:#fff;
    letter-spacing:0;text-shadow:0 1px 2px rgba(0,0,0,.28);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
  }
  .who .nm{color:var(--text2);font-weight:550;letter-spacing:.2px}
  .who .grp{
    margin-left:auto;font-size:11.5px;color:var(--text3);opacity:.78;
    max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  html[data-theme="light"] .av{text-shadow:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}

  /* ---------- 空状态 ---------- */
  .empty-state{text-align:center;padding:100px 20px;color:var(--text3)}
  .empty-state .ico{font-size:44px;opacity:.5;margin-bottom:14px}
  .empty-state h3{color:var(--text2);font-size:17px;font-weight:550;margin-bottom:8px}
  .empty-state p{font-size:13.5px;line-height:1.8}
  .empty-state code{background:var(--surface3);padding:2px 7px;border-radius:6px;color:var(--accent);font-size:12.5px}

  /* ---------- lightbox ---------- */
  .lb{position:fixed;inset:0;z-index:99;display:none;place-items:center;background:rgba(3,6,12,.93);
      backdrop-filter:blur(8px);cursor:zoom-out;padding:40px}
  .lb.show{display:grid}
  .lb img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .lb .close{position:absolute;top:20px;right:26px;color:#cbd5e1;font-size:26px;line-height:1}

  .proto-tip{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;
    display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;
    background:rgba(20,27,38,.92);border:1px solid var(--border-hi);color:var(--text2);
    font-size:12.5px;backdrop-filter:blur(10px);white-space:nowrap;
  }
  .proto-tip b{color:var(--accent)}
  html[data-theme="light"] .proto-tip{background:rgba(255,255,255,.94)}

  /* 竖屏 27 寸（1080×1920）：双列，卡片加厚留白 */
  @media (min-width:1000px) and (max-width:1200px){
    .wrap{max-width:1100px;padding:0 22px 80px}
    .card{padding:20px 22px 18px;border-radius:20px}
    header{padding:16px 2px}
  }
  @media (max-width:980px){
    .wrap{padding:0 16px 70px}
    .cols{columns:1}
  }
  @media (max-width:620px){
    header{gap:9px;flex-wrap:wrap;row-gap:10px;padding:12px 2px}
    .brand{font-size:16.5px;flex:1 1 auto;min-width:0}
    .brand small{display:none}
    .clock b{font-size:19px}
    .clock span{display:none}
    .pill{display:none}
    .icon-btn{width:34px;height:34px;border-radius:9px}
    .statusbar .chip.r{display:none}
  }
</style>
</head>
</html>
